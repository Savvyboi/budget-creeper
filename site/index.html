<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Valtion budjetti — mihin Suomen valtion rahat menevät?</title>
    <meta
      name="description"
      content="Selaa Suomen valtion talousarviota ja sen toteutumaa vuosittain. Avointa dataa Valtiokonttorin Tutkihallintoa-rajapinnasta."
    />

    <!--
      Every URL on this page is relative. That is the whole trick behind this
      build: the folder can be served from a domain root, from a GitHub Pages
      project path like /my-repo/, or from any subdirectory, with nothing to
      configure and no build step to run.
    -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Valtion budjetti" />
    <meta
      property="og:description"
      content="Mihin Suomen valtion rahat menevät? Selaa talousarviota ja toteutumaa pääluokittain, hallinnonaloittain ja menolajeittain."
    />
    <meta property="og:image" content="og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applies the stored theme before first paint. A separate file, not an
         inline script, so a `script-src 'self'` CSP does not block it. -->
    <script src="boot-theme.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#explorer" id="skip-link">Siirry selaimeen</a>

    <header class="app-header" id="app-header" hidden></header>

    <main class="page" id="main">
      <div class="boot" role="status" aria-live="polite" id="boot">
        <div class="boot__bar"><span></span></div>
        <p>Ladataan budjettitietoja…</p>
      </div>

      <section class="hero" id="summary" aria-labelledby="hero-title" hidden></section>

      <div id="explorer" hidden>
        <div class="toolbar" id="toolbar"></div>
        <nav class="crumbs" id="crumbs" aria-label="breadcrumb"></nav>
        <div class="explorer" id="explorer-grid">
          <section class="panel" id="level-panel" aria-live="polite"></section>
          <div id="detail-slot"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer" id="site-footer" hidden></footer>

    <div id="overlay"></div>

    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.6 system-ui, sans-serif">
        <h1>Valtion budjetti</h1>
        <p>
          Tämä palvelu tarvitsee JavaScriptin toimiakseen. Aineisto on saatavilla
          myös suoraan Valtiokonttorin avoimesta rajapinnasta:
          <a href="https://avoindata.tutkihallintoa.fi/api-details#api=valtiontalous"
            >avoindata.tutkihallintoa.fi</a
          >.
        </p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
