name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages on every push to the default
# branch. The budget data itself is committed under public/data and is only
# refreshed by running `npm run data` locally once a year, so this workflow never
# calls the Valtiokonttori API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        # A project site lives at https://<user>.github.io/<repo>/, so every asset
        # URL needs that prefix. For a user/org site (<user>.github.io) or a custom
        # domain, the site is served from the root — set BASE_PATH to "/" instead.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
